[package]
name = "discord-recorder"
version = "0.1.0"
edition = "2021"
description = "Screen, audio and webcam recorder with a Discord-inspired UI"
license = "MIT"

[lib]
name = "discord_recorder"
path = "src/lib.rs"

[[bin]]
name = "discord-recorder"
path = "src/main.rs"

[dependencies]
# GUI Framework
egui = "0.33.0"
eframe = "0.33.0"

# Screen Capture (preview thumbnails + display enumeration)
screenshots = "0.8"

# Audio device enumeration + level metering
cpal = "0.15"

# Webcam preview (recording itself goes through ffmpeg's v4l2 input)
nokhwa = { version = "0.10.9", features = ["input-native", "output-threaded"], optional = true }

# Wayland desktop capture: xdg-desktop-portal ScreenCast handshake + PipeWire stream
dbus = { version = "0.9", features = ["vendored"] }
pipewire = "0.8"

# Image Processing
image = "0.25.8"

# Error Handling
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Configuration
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"

# Time Handling
chrono = "0.4"

# Threading
crossbeam = "0.8"
once_cell = "1.19"

# Numeric conversion for audio samples
num-traits = "0.2.19"

[features]
default = ["webcam"]
webcam = ["dep:nokhwa"]

[profile.release]
opt-level = 3
lto = "thin"
